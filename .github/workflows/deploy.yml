name: Deploy to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ads-platform
  ECS_CLUSTER: ads-platform-cluster
  ECS_SERVICE: ads-platform-service
  ECS_TASK_DEFINITION: ads-platform-task

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR image URI
        id: image
        run: |
          echo "uri=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${GITHUB_SHA::7} \
            -t "${{ steps.image.outputs.uri }}" .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.image.outputs.uri }}"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > task-definition.json

      - name: Update ECS task definition image
        run: |
          jq \
            --arg IMAGE "${{ steps.image.outputs.uri }}" \
            '.containerDefinitions[0].image = $IMAGE
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )' \
            task-definition.json \
            > new-task-definition.json

      - name: Register new ECS task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json

      - name: Get latest task definition revision
        id: task-def
        run: |
          REVISION=$(aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query 'taskDefinition.revision' \
            --output text)

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${ECS_TASK_DEFINITION}:${{ steps.task-def.outputs.revision }}" \
            --force-new-deployment